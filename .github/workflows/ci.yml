name: CI

# What can be checked without a ROM: the tools install, IDO runs, the
# LZSS codec round-trips with its C and Python encoders in agreement, and
# the picture converter round-trips and edits synthetic entries. The
# matching builds need a baserom and run locally (README, "Build").

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install tools
        run: |
          sudo add-apt-repository -y universe  # the MIPS binutils live there
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu build-essential python3-venv

      - name: make setup
        run: make setup

      - name: IDO compiles
        run: |
          echo 'int f(int a) { return a * 3; }' > /tmp/t.c
          tools/ido/5.3/cc -c -O2 -mips2 -G 0 -o /tmp/t.o /tmp/t.c
          mips-linux-gnu-objdump -d /tmp/t.o

      - name: LZSS self-test
        run: .env/bin/python3 tools/test_lzss.py

      - name: Asset converter self-test
        run: .env/bin/python3 tools/test_assets.py --rom

      - name: Python tools parse
        run: .env/bin/python3 -m py_compile tools/*.py tools/assetlib/*.py
